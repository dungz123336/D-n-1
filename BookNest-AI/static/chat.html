<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookNest Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0a0614;
      --bg-panel: rgba(18, 10, 32, 0.78);
      --bg-glass: rgba(255, 255, 255, 0.045);
      --bg-glass-2: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(192, 38, 211, 0.35);
      --text: #f5f3ff;
      --text-soft: #c4b5fd;
      --muted: #9ca3af;
      --purple: #7c3aed;
      --fuchsia: #c026d3;
      --grad: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
      --grad-soft: linear-gradient(135deg, rgba(124, 58, 237, 0.35), rgba(192, 38, 211, 0.25));
      --green: #34d399;
      --gold: #fbbf24;
      --danger: #fb7185;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.04);
      --radius: 24px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(124, 58, 237, 0.28), transparent 55%),
        radial-gradient(700px 420px at 90% 20%, rgba(192, 38, 211, 0.18), transparent 50%),
        radial-gradient(600px 400px at 50% 100%, rgba(76, 29, 149, 0.25), transparent 55%),
        var(--bg-deep);
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Floating ambient orbs */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      animation: float 10s ease-in-out infinite;
    }
    body::before {
      width: 280px; height: 280px;
      background: rgba(124, 58, 237, 0.35);
      top: 8%; left: 12%;
    }
    body::after {
      width: 220px; height: 220px;
      background: rgba(192, 38, 211, 0.28);
      bottom: 10%; right: 14%;
      animation-delay: -4s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(420px, 100%);
      height: min(720px, calc(100vh - 40px));
      border-radius: var(--radius);
      background: var(--bg-panel);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow), 0 0 80px rgba(124, 58, 237, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: shellIn 0.5s cubic-bezier(.22,1,.36,1);
    }
    @keyframes shellIn {
      from { opacity: 0; transform: translateY(16px) scale(.98); }
      to { opacity: 1; transform: none; }
    }

    /* ========== HEADER ========== */
    .header {
      padding: 14px 14px 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(124,58,237,.12), transparent);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .orb-wrap {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--grad);
      box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 0 24px rgba(192, 38, 211, .55);
      position: relative;
      overflow: hidden;
      animation: orbPulse 2.8s ease-in-out infinite;
    }
    .orb::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff 0%, transparent 40%),
                  linear-gradient(145deg, rgba(255,255,255,.35), transparent);
      opacity: .55;
    }
    .orb::after {
      content: "✦";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 16px;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .orb-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid rgba(192, 38, 211, .45);
      animation: ring 2.8s ease-out infinite;
    }
    @keyframes orbPulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 0 18px rgba(192,38,211,.45); }
      50% { box-shadow: 0 0 0 2px rgba(255,255,255,.18), 0 0 32px rgba(124,58,237,.75); }
    }
    @keyframes ring {
      0% { transform: scale(.92); opacity: .8; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .brand { min-width: 0; }
    .brand h1 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand .sub {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--text-soft);
      font-weight: 500;
    }
    .online {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    .status-line {
      margin-top: 3px;
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      transition: color .3s;
    }
    .status-line.thinking { color: var(--text-soft); }

    .header-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transform: translateX(6px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .header:hover .header-actions,
    .header:focus-within .header-actions {
      opacity: 1;
      transform: none;
    }
    .icon-btn {
      width: 34px; height: 34px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all .2s ease;
    }
    .icon-btn:hover {
      color: var(--text);
      background: var(--bg-glass-2);
      border-color: var(--border);
      transform: translateY(-1px);
    }
    .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ========== QUICK ACTIONS ========== */
    .chips-wrap {
      flex-shrink: 0;
      padding: 10px 0 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,.12);
    }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 14px 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--bg-glass);
      border: 1px solid transparent;
      background-clip: padding-box;
      position: relative;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      white-space: nowrap;
    }
    .chip::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(124,58,237,.7), rgba(192,38,211,.55), rgba(255,255,255,.12));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.25);
      background: rgba(124, 58, 237, 0.15);
    }
    .chip span.ic { font-size: 13px; line-height: 1; }

    /* ========== MESSAGES ========== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(124,58,237,.35);
      border-radius: 99px;
    }

    .welcome {
      margin: 4px 2px 8px;
      padding: 20px 18px;
      border-radius: 20px;
      background: var(--grad-soft);
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 40px rgba(124,58,237,.15), inset 0 1px 0 rgba(255,255,255,.08);
      animation: fadeUp .45s ease;
    }
    .welcome h2 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fff, #e9d5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .welcome p {
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-soft);
    }
    .welcome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .welcome-card {
      text-align: left;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(10, 6, 20, 0.45);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all .2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .welcome-card:hover {
      transform: translateY(-2px) scale(1.01);
      border-color: rgba(192,38,211,.45);
      box-shadow: 0 8px 20px rgba(124,58,237,.2);
      background: rgba(124,58,237,.18);
    }

    .prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .prompt {
      border: 1px dashed rgba(255,255,255,.14);
      background: transparent;
      color: var(--text-soft);
      font-size: 11.5px;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .2s;
    }
    .prompt:hover {
      border-style: solid;
      border-color: rgba(192,38,211,.4);
      color: var(--text);
      background: rgba(124,58,237,.12);
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 92%;
      animation: fadeUp .3s ease;
    }
    .row.user { align-self: flex-end; align-items: flex-end; }
    .row.bot { align-self: flex-start; align-items: flex-start; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .bubble {
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.bot .bubble {
      background: var(--bg-glass-2);
      border: 1px solid var(--border);
      box-shadow: 0 8px 28px rgba(0,0,0,.2), 0 0 0 1px rgba(124,58,237,.05), inset 0 1px 0 rgba(255,255,255,.05);
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(12px);
    }
    .row.user .bubble {
      background: var(--grad);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.35);
    }
    .time {
      font-size: 10px;
      color: var(--muted);
      padding: 0 4px;
      letter-spacing: 0.02em;
    }

    /* Thinking */
    .thinking {
      align-self: flex-start;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-soft);
      max-width: 92%;
    }
    .thinking.show { display: inline-flex; animation: fadeUp .25s ease; }
    .dots { display: flex; gap: 4px; }
    .dots i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--purple);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots i:nth-child(2) { animation-delay: .15s; background: #a855f7; }
    .dots i:nth-child(3) { animation-delay: .3s; background: var(--fuchsia); }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ========== CARDS ========== */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }
    .book-card {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(15, 8, 28, 0.65);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s;
      overflow: hidden;
      position: relative;
    }
    .book-card:hover {
      transform: translateY(-3px);
      border-color: rgba(192,38,211,.4);
      box-shadow: 0 16px 40px rgba(124,58,237,.22);
    }
    .book-cover {
      width: 72px;
      height: 100px;
      border-radius: 10px;
      background: var(--grad-soft);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 28px;
      overflow: hidden;
      position: relative;
    }
    .book-cover img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .book-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .book-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .book-author { font-size: 11.5px; color: var(--muted); }
    .book-meta {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      font-size: 11px; margin-top: 2px;
    }
    .rating { color: var(--gold); font-weight: 600; }
    .price { font-weight: 700; color: #e9d5ff; }
    .price s { color: var(--muted); font-weight: 500; margin-left: 4px; font-size: 10.5px; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: .02em;
    }
    .badge.sale { background: rgba(251,113,133,.15); color: #fda4af; border: 1px solid rgba(251,113,133,.3); }
    .badge.best { background: rgba(251,191,36,.12); color: #fcd34d; border: 1px solid rgba(251,191,36,.3); }
    .badge.stock { background: rgba(52,211,153,.1); color: #6ee7b7; border: 1px solid rgba(52,211,153,.25); }
    .book-actions {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .btn {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 650;
      border-radius: 10px;
      padding: 7px 10px;
      transition: transform .15s, filter .15s, background .15s;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .btn:active { transform: scale(.98); }
    .btn.primary {
      background: var(--grad);
      color: white;
      box-shadow: 0 6px 16px rgba(124,58,237,.3);
    }
    .btn.ghost {
      background: var(--bg-glass);
      color: var(--text-soft);
      border: 1px solid var(--border);
    }

    .order-card, .voucher-card {
      padding: 14px;
      border-radius: 18px;
      background: rgba(15, 8, 28, 0.7);
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    .order-card h4, .voucher-card h4 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0 12px;
      padding-left: 4px;
    }
    .tl-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
      color: var(--muted);
    }
    .tl-item.done { color: var(--text-soft); }
    .tl-item.active { color: #e9d5ff; font-weight: 600; }
    .tl-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--border);
      margin-top: 1px;
      flex-shrink: 0;
    }
    .tl-item.done .tl-dot {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 8px rgba(52,211,153,.4);
    }
    .tl-item.active .tl-dot {
      border-color: var(--fuchsia);
      box-shadow: 0 0 0 3px rgba(192,38,211,.2);
      background: var(--fuchsia);
    }

    .voucher-card {
      position: relative;
      overflow: hidden;
      border-color: rgba(192,38,211,.35);
      box-shadow: 0 0 30px rgba(124,58,237,.18), 0 10px 28px rgba(0,0,0,.22);
    }
    .voucher-card::before {
      content: "";
      position: absolute;
      inset: -40% auto auto -20%;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(192,38,211,.35), transparent 70%);
      pointer-events: none;
    }
    .voucher-code {
      font-family: ui-monospace, monospace;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #f5d0fe;
      margin: 4px 0 6px;
    }
    .voucher-meta { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    /* ========== INPUT ========== */
    .composer {
      flex-shrink: 0;
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
      background: linear-gradient(0deg, rgba(10,6,20,.85), rgba(18,10,32,.55));
    }
    .composer.dragover {
      outline: 2px dashed rgba(192,38,211,.55);
      outline-offset: -6px;
      background: rgba(124,58,237,.12);
    }
    .input-shell {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 10px 10px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      transition: border-color .2s, box-shadow .2s;
    }
    .input-shell:focus-within {
      border-color: rgba(192,38,211,.45);
      box-shadow: 0 0 0 3px rgba(124,58,237,.15), inset 0 1px 0 rgba(255,255,255,.05);
    }
    #input {
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font: 500 13.5px/1.45 var(--font);
      min-height: 44px;
      max-height: 110px;
      padding: 4px 2px;
    }
    #input::placeholder { color: #6b7280; }
    .input-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tools-left { display: flex; gap: 2px; }
    .tool {
      width: 32px; height: 32px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all .18s;
    }
    .tool:hover {
      color: var(--text);
      background: var(--bg-glass-2);
    }
    .tool.active {
      color: #f0abfc;
      background: rgba(192,38,211,.18);
      box-shadow: 0 0 16px rgba(192,38,211,.25);
    }
    .tool svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .send {
      width: 38px; height: 38px;
      border: 0;
      border-radius: 14px;
      background: var(--grad);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(124,58,237,.4);
      transition: transform .15s, filter .15s, opacity .15s;
    }
    .send:hover { transform: translateY(-1px) scale(1.03); filter: brightness(1.08); }
    .send:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .send svg { width: 16px; height: 16px; fill: currentColor; }

    /* Voice overlay */
    .voice-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(8, 4, 18, 0.82);
      backdrop-filter: blur(16px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      animation: fadeUp .25s ease;
    }
    .voice-overlay.show { display: flex; }
    .wave {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 40px;
    }
    .wave span {
      width: 4px;
      border-radius: 99px;
      background: var(--grad);
      animation: wave 1s ease-in-out infinite;
    }
    .wave span:nth-child(1) { height: 12px; animation-delay: 0s; }
    .wave span:nth-child(2) { height: 24px; animation-delay: .1s; }
    .wave span:nth-child(3) { height: 36px; animation-delay: .2s; }
    .wave span:nth-child(4) { height: 20px; animation-delay: .3s; }
    .wave span:nth-child(5) { height: 28px; animation-delay: .15s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(.5); opacity: .5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .voice-text { font-size: 14px; font-weight: 600; color: var(--text-soft); }
    .voice-sub { font-size: 12px; color: var(--muted); }
    .voice-stop {
      margin-top: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-glass);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    .settings-panel, .history-panel {
      display: none;
      position: absolute;
      top: 64px; right: 12px;
      width: 220px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(18, 10, 32, 0.95);
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      z-index: 15;
      animation: fadeUp .2s ease;
    }
    .settings-panel.show, .history-panel.show { display: block; }
    .settings-panel label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .settings-panel input, .settings-panel select {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font: 500 12px var(--font);
    }
    .history-item {
      font-size: 11.5px;
      color: var(--text-soft);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .history-item:hover {
      background: var(--bg-glass);
      border-color: var(--border);
    }

    .toast {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(20, 10, 36, 0.95);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 30;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile full screen */
    @media (max-width: 520px) {
      body { padding: 0; }
      .shell {
        width: 100%;
        height: 100%;
        border-radius: 0;
        max-height: none;
      }
      .header-actions { opacity: 1; transform: none; }
    }

    @media (min-width: 768px) and (max-width: 1024px) {
      .shell {
        width: min(480px, 100%);
        height: min(780px, calc(100vh - 40px));
      }
    }

    .hidden { display: none !important; }
  </style>

</head>
<body>
  <div class="shell" id="shell">
    <header class="header">
      <div class="header-left">
        <div class="orb-wrap">
          <div class="orb-ring"></div>
          <div class="orb" aria-hidden="true"></div>
        </div>
        <div class="brand">
          <h1>BookNest Concierge</h1>
          <div class="sub">
            <span class="online"></span>
            AI tư vấn sách
          </div>
          <div class="status-line" id="statusLine">Đang trực tuyến</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnExpand" title="Phóng to" type="button">
          <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="icon-btn" id="btnHistory" title="Lịch sử" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="btnSettings" title="Cài đặt" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="btnClose" title="Đóng" type="button">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="chips-wrap"><div class="chips" id="chips"></div></div>
    <div class="messages" id="messages"></div>
    <div class="thinking" id="thinking">
      <div class="dots"><i></i><i></i><i></i></div>
      <span id="thinkingText">Đang tìm đầu sách phù hợp...</span>
    </div>

    <div class="composer" id="composer">
      <form class="input-shell" id="form">
        <textarea id="input" rows="1" placeholder="Hỏi về sách, tác giả, đơn hàng hoặc mã giảm giá..."></textarea>
        <div class="input-tools">
          <div class="tools-left">
            <button type="button" class="tool" id="btnVoice" title="Giọng nói"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg></button>
            <button type="button" class="tool" id="btnImage" title="Tải ảnh"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-5 5"/></svg></button>
            <button type="button" class="tool" id="btnBarcode" title="Quét ISBN"><svg viewBox="0 0 24 24"><path d="M4 7V5h2M18 5h2v2M20 17v2h-2M6 19H4v-2"/><path d="M7 8h1v8H7zM10 8h2v8h-2zM14 8h1v8h-1zM17 8h1v8h-1z"/></svg></button>
            <button type="button" class="tool" id="btnEmoji" title="Cảm xúc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 14.5S10 16.5 12 16.5s3.5-2 3.5-2"/></svg></button>
            <button type="button" class="tool" id="btnAttach" title="Đính kèm"><svg viewBox="0 0 24 24"><path d="M21 12.5V18a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h7.5"/><path d="M17 3v6h6"/><path d="M14 10l9-9"/></svg></button>
          </div>
          <button type="submit" class="send" id="btnSend" title="Gửi"><svg viewBox="0 0 24 24"><path d="M3.4 20.6L21 12 3.4 3.4 3 10l11 2-11 2z"/></svg></button>
        </div>
      </form>
      <input type="file" id="fileImage" accept="image/*" hidden />
      <input type="file" id="fileAttach" hidden />
    </div>

    <div class="voice-overlay" id="voiceOverlay">
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="voice-text" id="voiceText">Đang lắng nghe...</div>
      <div class="voice-sub" id="voiceSub">Bạn hãy nói tên sách hoặc chủ đề muốn tìm.</div>
      <button type="button" class="voice-stop" id="voiceStop">Dừng</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <label>Mã khách hàng<input id="customerId" type="number" value="1" min="1" /></label>
      <label>Ngôn ngữ<select id="language"><option value="vi" selected>Tiếng Việt</option><option value="en">English</option></select></label>
      <button type="button" class="btn ghost" id="btnNewSession" style="width:100%">Hội thoại mới</button>
    </div>
    <div class="history-panel" id="historyPanel">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;">Gần đây</div>
      <div id="historyList"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="/static/app.js?v=vi3"></script>
</body>
</html>
